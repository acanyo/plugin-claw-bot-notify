plugins {
    id 'java'
    id "com.diffplug.spotless" version "8.10.2"
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.9.0"
}

group 'com.xhhao.clawbotnotify'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.27.0')
    compileOnly 'run.halo.app:api'
    compileOnly 'run.halo.aifoundation:api:1.0.0'
    implementation 'org.commonmark:commonmark:0.21.0'

    testImplementation 'run.halo.app:api'
    testImplementation 'run.halo.aifoundation:api:1.0.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.27.0'
}

haloPlugin {
    openApi {
        groupingRules {
            clawBotConsole {
                displayName = 'ClawBot Console API'
                pathsToMatch = ['/apis/console.api.clawbot.xhhao.com/v1alpha1/**']
            }
        }
        groupedApiMappings = ['/v3/api-docs/clawBotConsole': 'clawBotConsole.json']
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
        }
    }
}

spotless {
    java {
        palantirJavaFormat("2.90.0").formatJavadoc(true)
    }
}

tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.register('processManagedCliResources', Sync) {
    from project(':managed-cli').layout.buildDirectory.dir('installer')
    into layout.buildDirectory.dir('resources/main/managed-cli')
    dependsOn project(':managed-cli').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processManagedCliResources')
}
